name: GovCheck check slice (report-only)

# Meta-level CI dogfooding the first executable GovCheck slice (govcheck/check.py).
# Hosted CI on this public repository was explicitly authorized by the maintainer
# on 2026-11-09 (recorded in issue #88). Report-only: unit tests are blocking,
# the check report never fails the build while the slice is young (an overall
# `unknown` is fail-closed, not a success).

on:
  pull_request:
    paths:
      - 'govcheck/**'
      - 'tests/**'
      - 'scripts/**'
      - '.github/workflows/govcheck-check.yml'
  push:
    branches: [main]
    paths:
      - 'govcheck/**'
      - 'tests/**'
      - 'scripts/**'
      - '.github/workflows/govcheck-check.yml'

permissions:
  contents: read

jobs:
  govcheck-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit tests of the check slice (blocking)
        run: python3 -m unittest discover -s tests -v
      - name: Run govcheck check on the candidate (report-only)
        continue-on-error: true
        run: |
          python3 govcheck/check.py --tree . --base origin/main --candidate HEAD --out govcheck-report.json || true
      - name: Show the JSON report
        if: always()
        run: cat govcheck-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: govcheck-report
          path: govcheck-report.json
          retention-days: 30
  # Full reproduction suite for the external-critique audit (#130). Kept in
  # this established workflow so a PR can execute it before a new workflow
  # file is merged into the default branch.
  audit-python:
    name: Audit — Python suite and reference integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Record audited revision and environment
        run: |
          git rev-parse HEAD
          python --version
          git --version
      - name: Complete Python test suite
        run: python -m unittest discover -s tests -v
      - name: Repository-wide reference integrity
        run: python scripts/check-reference-integrity.py

  audit-tla:
    name: Audit — TLC ${{ matrix.model }}
    strategy:
      fail-fast: false
      matrix:
        model:
          - CICheckRouting
          - GovCheckAssurance
          - GovCheckAuthority
          - GovCheckCanonicalPublication
          - GovCheckGovernanceApplicability
          - GovCheckGovernanceControls
          - GovCheckJournalRecovery
          - GovCheckLifecycle
    uses: ./.github/workflows/tla-model-reusable.yml
    with:
      model: ${{ matrix.model }}

  audit-lean:
    name: Audit — Lean coherence build and axiom report
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        shell: bash
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Generate Lake manifest
        working-directory: formal/lean
        run: lake update
      - name: Build and audit configured proof root
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: formal/lean
          build: true
          build-args: GovCheckCoherence
          auto-config: false
          axiom-audit: true
          axiom-audit-root: GovCheckCoherence.Proofs
      - name: Emit explicit axiom report
        working-directory: formal/lean
        run: lake env lean GovCheckCoherence/AxiomReport.lean

  audit-cslib:
    name: Audit — isolated CSLib compatibility build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install elan and pinned CSLib toolchain
        shell: bash
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/elan" toolchain install "$(cat formal/cslib-compat/lean-toolchain)"
      - name: Cache pinned CSLib dependencies and build outputs
        uses: actions/cache@v4
        with:
          path: |
            formal/cslib-compat/.lake/packages
            formal/cslib-compat/.lake/build
          key: cslib-${{ runner.os }}-${{ hashFiles('formal/cslib-compat/lean-toolchain', 'formal/cslib-compat/lakefile.lean') }}
      - name: Resolve pinned dependencies and build compatibility probe
        working-directory: formal/cslib-compat
        run: |
          lake update
          lake exe cache get
          lake build CslibCompat
