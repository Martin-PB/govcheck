name: Lean epistemic core

on:
  push:
    branches:
      - main
      - "formal/metamodel-epistemic-core-*"
    paths:
      - "formal/lean/**"
      - ".github/workflows/lean-epistemic-core.yml"
  pull_request:
    paths:
      - "formal/lean/**"
      - ".github/workflows/lean-epistemic-core.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lean-build:
    name: Kernel-checked Lean build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install elan and pinned Lean toolchain
        shell: bash
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/elan" toolchain install "$(cat formal/lean/lean-toolchain)"
      - name: Generate Lake manifest and build
        working-directory: formal/lean
        run: |
          lake update
          lake build
