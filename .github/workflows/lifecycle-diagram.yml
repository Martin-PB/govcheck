name: Lifecycle diagram consistency

on:
  pull_request:
    paths:
      - 'formal/lifecycle-transitions.json'
      - 'scripts/render-lifecycle-diagram.py'
      - 'docs/formal/lifecycle-diagram.mmd'
      - '.github/workflows/lifecycle-diagram.yml'
  push:
    branches: [main]
    paths:
      - 'formal/lifecycle-transitions.json'
      - 'scripts/render-lifecycle-diagram.py'
      - 'docs/formal/lifecycle-diagram.mmd'
      - '.github/workflows/lifecycle-diagram.yml'

permissions:
  contents: read

jobs:
  diagram-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check generated lifecycle diagram is fresh
        run: python3 scripts/render-lifecycle-diagram.py --check
