name: Reconcile SACM source-view branch with main

on:
  push:
    branches:
      - work/sacm-source-view-conflict-mainline

permissions:
  contents: write

concurrency:
  group: reconcile-sacm-source-view-mainline
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - name: Check out complete history
        uses: actions/checkout@v4
        with:
          ref: work/sacm-source-view-conflict-mainline
          fetch-depth: 0

      - name: Merge current main without discarding non-conflicting SACM work
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          if git merge-base --is-ancestor origin/main HEAD; then
            echo "Current main is already an ancestor; nothing to reconcile."
            exit 0
          fi
          git merge --no-edit -X theirs origin/main
          git push origin HEAD:work/sacm-source-view-conflict-mainline
