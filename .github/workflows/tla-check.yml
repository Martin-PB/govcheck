name: Formal model and governance checks

on:
  pull_request:
    paths:
      - 'formal/tla/**'
      - 'formal/schemas/**'
      - 'formal/fixtures/**'
      - 'formal/lifecycle-transitions.json'
      - 'scripts/validate-version-governance.py'
      - 'tests/test_version_governance_validator.py'
      - 'scripts/render-lifecycle-diagram.py'
      - 'docs/formal/lifecycle-diagram.mmd'
      - '.github/workflows/tla-check.yml'
  push:
    branches: [main]
    paths:
      - 'formal/tla/**'
      - 'formal/schemas/**'
      - 'formal/fixtures/**'
      - 'formal/lifecycle-transitions.json'
      - 'scripts/validate-version-governance.py'
      - 'tests/test_version_governance_validator.py'
      - 'scripts/render-lifecycle-diagram.py'
      - 'docs/formal/lifecycle-diagram.mmd'
      - '.github/workflows/tla-check.yml'

jobs:
  python-validator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run version-governance validator unit tests
        run: python3 -m unittest discover -s tests -p 'test_version_governance_validator.py' -v
      - name: Compile validator and tests
        run: python3 -m py_compile scripts/validate-version-governance.py tests/test_version_governance_validator.py

  diagram-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check generated lifecycle diagram is fresh
        run: |
          set +e
          python3 scripts/render-lifecycle-diagram.py --check 2>&1 | tee drift-check.log
          check_rc=${PIPESTATUS[0]}
          echo "check-exit=${check_rc}" | tee -a drift-check.log
          python3 --version 2>&1 | tee -a drift-check.log
          git status --porcelain | tee -a drift-check.log
          exit "${check_rc}"
      - name: Upload drift check log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: drift-check-log
          path: drift-check.log

  tlc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Download pinned tla2tools (v1.7.4, checksum-verified)
        run: |
          curl -fsSL -o tla2tools.jar https://downloads.sourceforge.net/project/tlaplus.mirror/v1.7.4/tla2tools.jar
          echo "936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88  tla2tools.jar" | sha256sum -c -
          sha256sum tla2tools.jar | tee tla2tools.sha256
      - name: Run SANY parse check
        run: |
          set -o pipefail
          java -cp tla2tools.jar tla2sany.SANY formal/tla/GovCheckLifecycle.tla 2>&1 | tee sany-lifecycle-report.txt
          if grep -Eq 'Semantic errors:|\*\*\* Errors:' sany-lifecycle-report.txt; then
            echo "SANY reported semantic errors for GovCheckLifecycle.tla" >&2
            exit 1
          fi
      - name: Run TLC with pinned lifecycle configuration
        run: |
          set -o pipefail
          java -cp tla2tools.jar tlc2.TLC -config formal/tla/GovCheckLifecycle.cfg formal/tla/GovCheckLifecycle.tla 2>&1 | tee tlc-lifecycle-report.txt
      - name: Run SANY parse check for assurance model
        run: |
          set -o pipefail
          java -cp tla2tools.jar tla2sany.SANY formal/tla/GovCheckAssurance.tla 2>&1 | tee sany-assurance-report.txt
          if grep -Eq 'Semantic errors:|\*\*\* Errors:' sany-assurance-report.txt; then
            echo "SANY reported semantic errors for GovCheckAssurance.tla" >&2
            exit 1
          fi
      - name: Run TLC with pinned assurance configuration
        run: |
          set -o pipefail
          java -cp tla2tools.jar tlc2.TLC -config formal/tla/GovCheckAssurance.cfg formal/tla/GovCheckAssurance.tla 2>&1 | tee tlc-assurance-report.txt
      - name: Upload TLC report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tlc-report
          path: |
            tlc-lifecycle-report.txt
            tlc-assurance-report.txt
            sany-lifecycle-report.txt
            sany-assurance-report.txt
            tla2tools.sha256
