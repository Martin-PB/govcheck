name: TLC — governance revision applicability model

on:
  pull_request:
    paths:
      - 'formal/tla/GovCheckGovernanceApplicability.tla'
      - 'formal/tla/GovCheckGovernanceApplicability.cfg'
      - 'formal/tla/GovCheckCanonicalPublication.tla'
      - 'formal/tla/GovCheckCanonicalPublication.cfg'
      - 'formal/tla/GovCheckGovernanceControls.tla'
      - 'formal/tla/GovCheckGovernanceControls.cfg'
      - 'formal/tla/GovCheckJournalRecovery.tla'
      - 'formal/tla/GovCheckJournalRecovery.cfg'
      - 'docs/specifications/0006-governance-revision-applicability.md'
      - 'docs/specifications/0006-governance-revision-applicability.fr.md'
      - '.github/workflows/tla-governance-applicability.yml'
      - '.github/workflows/tla-model-reusable.yml'
  push:
    branches: [main]
    paths:
      - 'formal/tla/GovCheckGovernanceApplicability.tla'
      - 'formal/tla/GovCheckGovernanceApplicability.cfg'
      - 'formal/tla/GovCheckCanonicalPublication.tla'
      - 'formal/tla/GovCheckCanonicalPublication.cfg'
      - 'formal/tla/GovCheckGovernanceControls.tla'
      - 'formal/tla/GovCheckGovernanceControls.cfg'
      - 'formal/tla/GovCheckJournalRecovery.tla'
      - 'formal/tla/GovCheckJournalRecovery.cfg'
      - 'docs/specifications/0006-governance-revision-applicability.md'
      - 'docs/specifications/0006-governance-revision-applicability.fr.md'
      - '.github/workflows/tla-governance-applicability.yml'
      - '.github/workflows/tla-model-reusable.yml'

jobs:
  governance-applicability:
    uses: ./.github/workflows/tla-model-reusable.yml
    with:
      model: GovCheckGovernanceApplicability

  canonical-publication:
    uses: ./.github/workflows/tla-model-reusable.yml
    with:
      model: GovCheckCanonicalPublication

  governance-controls:
    uses: ./.github/workflows/tla-model-reusable.yml
    with:
      model: GovCheckGovernanceControls

  journal-recovery:
    uses: ./.github/workflows/tla-model-reusable.yml
    with:
      model: GovCheckJournalRecovery
