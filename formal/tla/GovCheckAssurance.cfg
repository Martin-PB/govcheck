SPECIFICATION Spec

CONSTANTS
  Claims = {root, testClaim}
  Evidence = {modelEvidence, testEvidence}
  Dependencies = {candidate, policy}
  Versions = {v0, v1}
  Actors = {alice, bob}
  AuthorizedReviewers = {bob}
  RootClaim = root
  ClaimEdgePairs = {{root, testClaim}}
  ClaimEvidence = [root |-> {modelEvidence}, testClaim |-> {testEvidence}]
  ClaimEvidenceClosure =
    [root |-> {modelEvidence, testEvidence},
     testClaim |-> {testEvidence}]
  ClaimClosure =
    [root |-> {root, testClaim}, testClaim |-> {testClaim}]
  ClaimRank = [root |-> 1, testClaim |-> 0]
  ClaimDependencies =
    [root |-> {candidate, policy}, testClaim |-> {candidate}]
  ClaimProducer = [root |-> alice, testClaim |-> alice]
  ClaimReviewer = [root |-> bob, testClaim |-> bob]
  EvidenceDependencies =
    [modelEvidence |-> {policy}, testEvidence |-> {candidate}]
  InitialVersions = [candidate |-> v0, policy |-> v0]
  InitialEvidenceVersions =
    [modelEvidence |-> [candidate |-> v0, policy |-> v0],
     testEvidence |-> [candidate |-> v0, policy |-> v0]]
  InitialEvidenceOutcomes =
    [modelEvidence |-> "Supports", testEvidence |-> "Supports"]
  InitialEvidenceExpiry =
    [modelEvidence |-> 2, testEvidence |-> 2]
  MaxTime = 2
  NoSnapshot = noSnapshot

INVARIANTS
  TypeOK
  ArgumentGraphWellFormed
  ReviewBinding
  ClaimStatusSoundness
  AcceptedImpliesSupported
  AcceptedDependencySnapshotCurrent
  RevokedEvidenceNotCurrent

PROPERTIES
  AcceptedDiscipline
