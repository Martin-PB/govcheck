SPECIFICATION Spec

CONSTANTS
  Claims = {root, testClaim}
  Evidence = {modelEvidence, testEvidence}
  Dependencies = {candidate, policy}
  Versions = {v0, v1}
  Actors = {alice, bob}
  AuthorizedReviewers = {bob}
  RootClaim = root
  ClaimEdgePairs = {{root, testClaim}}
  ClaimEvidence = [c \in Claims |-> IF c = root THEN {modelEvidence} ELSE {testEvidence}]
  ClaimEvidenceClosure = [c \in Claims |-> IF c = root THEN {modelEvidence, testEvidence} ELSE {testEvidence}]
  ClaimClosure = [c \in Claims |-> IF c = root THEN {root, testClaim} ELSE {testClaim}]
  ClaimRank = [c \in Claims |-> IF c = root THEN 1 ELSE 0]
  ClaimDependencies = [c \in Claims |-> IF c = root THEN {candidate, policy} ELSE {candidate}]
  ClaimProducer = [c \in Claims |-> alice]
  ClaimReviewer = [c \in Claims |-> bob]
  EvidenceDependencies = [e \in Evidence |-> IF e = modelEvidence THEN {policy} ELSE {candidate}]
  InitialVersions = [d \in Dependencies |-> v0]
  InitialEvidenceVersions = [e \in Evidence |-> [d \in Dependencies |-> v0]]
  InitialEvidenceOutcomes = [e \in Evidence |-> "Supports"]
  InitialEvidenceExpiry = [e \in Evidence |-> 2]
  MaxTime = 2
  NoSnapshot = noSnapshot

INVARIANTS
  TypeOK
  ArgumentGraphWellFormed
  ReviewBinding
  ClaimStatusSoundness
  AcceptedImpliesSupported
  AcceptedDependencySnapshotCurrent
  RevokedEvidenceNotCurrent

PROPERTIES
  AcceptedDiscipline
