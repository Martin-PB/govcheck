SPECIFICATION Spec
CHECK_DEADLOCK FALSE

CONSTANTS
  Principals = {root, priorEvaluator, shadowEvaluator}
  RootPrincipal = root
  PriorEvaluator = priorEvaluator
  ShadowEvaluator = shadowEvaluator
  InitialRevision = gov0
  GovernanceRevisions = {gov0, gov1, gov2}
  Candidates = {candidate0, candidate1}
  EvaluationIds = {eval0, eval1}
  AuthorizationIds = {auth0, auth1}
  ExceptionIds = {exception0}
  Requirements = {waivable, mandatory}
  WaivableRequirements = {waivable}
  NonDerogableRequirements = {mandatory}
  Contents = {contentA, contentB}
  CandidateContent = [candidate0 |-> contentB, candidate1 |-> contentA]
  CandidateRequirement = [candidate0 |-> waivable, candidate1 |-> mandatory]
  RevisionsContent = [gov0 |-> contentA, gov1 |-> contentB, gov2 |-> contentA]

INVARIANTS
  TypeOK
  UniquePublishedRevisions
  PublicationUsesPriorAuthority
  ShadowCannotAuthorize
  UnknownAndConflictBlock
  NonDerogableNeverExcepted
  RevocationIsProspective
  HistoricalDecisionsPreserved
  NoStaleAuthorization

PROPERTIES
  AppendOnly
