SPECIFICATION Spec

\* Terminal phases and the explicit history bound are intentional stops.
CHECK_DEADLOCK FALSE

CONSTANTS
  Actors = {alice, bob}
  AuthorizedActors = {alice, bob}
  RequiredApprovals = 1
  HistoryLimit = 12
  Bases = {base0, base1}
  Candidates = {candidate0, candidate1}
  Governances = {gov0, gov1}
  Specs = {spec0, spec1}
  Obligations = {tests, review}
  Pass = "Pass"
  Fail = "Fail"
  Unknown = "Unknown"
  NoTuple = noTuple
  NoCandidate = noCandidate

INVARIANTS
  TypeOK
  AcceptanceSoundness
  ApplicationSoundness
  NoStaleEvaluation
  EvidenceBinding
  ApprovalBinding
  NoImplicitApplication
  HistoryNonEmpty
  NoUnexpectedNonterminalDeadlock

PROPERTIES
  TerminalDiscipline
